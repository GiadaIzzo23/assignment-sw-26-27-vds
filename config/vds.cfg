# Vehicle Dashboard Simulator - configuration.
# Every value below is the built-in default (src/core/Config.hpp). Edit it and
# restart the simulator (no recompilation needed), or pass another file.
# Format: "section.key = number". '#' starts a comment.

# --- warning thresholds ---
# Temperatures are "rising" signals: caution < warning < critical.
# SoC and pressure are "falling" signals: caution > warning > critical.
# hysteresis: how far the value must recover before the warning de-escalates.
thresholds.inverter_temp.caution = 70
thresholds.inverter_temp.warning = 85
thresholds.inverter_temp.critical = 100
thresholds.inverter_temp.hysteresis = 3

thresholds.motor_temp.caution = 90
thresholds.motor_temp.warning = 110
thresholds.motor_temp.critical = 125
thresholds.motor_temp.hysteresis = 3

thresholds.pack_temp.caution = 42
thresholds.pack_temp.warning = 50
thresholds.pack_temp.critical = 58
thresholds.pack_temp.hysteresis = 2

thresholds.soc.caution = 30
thresholds.soc.warning = 20
thresholds.soc.critical = 10
thresholds.soc.hysteresis = 2

thresholds.tank_pressure.caution = 8
thresholds.tank_pressure.warning = 7
thresholds.tank_pressure.critical = 6
thresholds.tank_pressure.hysteresis = 0.3

# --- display scales ---
